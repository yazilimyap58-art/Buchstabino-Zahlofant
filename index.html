<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffb703">
  <meta name="description" content="Buchstabino & Zahlofant – Kindgerechtes Mathe-Lernspiel">
  <title>🧮 Buchstabino & Zahlofant</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/gamelogo.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Chewy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Herz-Feier bei Streak-Meilensteinen (siehe js/celebration.js):
       blockierendes, aber durchsichtiges Overlay - liegt zwischen
       .feedback-area (z-index 50) und #confetti-canvas/#mascot-flyer
       (100/500), damit Konfetti und das ankommende Maskottchen weiterhin
       sichtbar über dem abgedunkelten Hintergrund bleiben. -->
  <div class="celebration-overlay" id="celebration-overlay" hidden aria-hidden="true">
    <canvas id="hearts-canvas" aria-hidden="true"></canvas>
  </div>

  <!-- Hilfe-Funktion: fliegt vom Kopfzeilen-Maskottchen zur richtigen
       Antwort (siehe Mascot.flyTo()); geteilt zwischen screen-game und
       screen-letter-draw, da immer nur eines der beiden aktiv ist. -->
  <img class="mascot-img mascot-flyer" id="mascot-flyer" data-pose="pointing" aria-hidden="true" hidden>

  <main class="app-shell" role="main" aria-label="Buchstabino & Zahlofant">

    <!-- Kategoriewahl-Screen (erste Ebene): Buchstaben oder Zahlen -->
    <section class="screen mode-select category-select" id="screen-category-select">
      <div class="mode-select__header mode-select__header--hero">
        <img class="app-logo" src="assets/icons/gamelogo.png" alt="" width="120" height="120">
        <h1 class="mode-select__title mode-select__title--logo">
          <span class="logo-word logo-word--buchstabino">Buchstabino</span><span class="logo-amp">&amp;</span><span class="logo-word logo-word--zahlofant">Zahlofant</span>
        </h1>
      </div>
      <p class="mode-select__subtitle">Was möchtest du lernen?</p>

      <button class="btn-album" id="btn-open-album" type="button" aria-label="Sticker-Album öffnen">
        <span aria-hidden="true">🎁</span>
      </button>

      <div class="mode-cards">
        <button class="mode-card category-card" type="button" data-category="letters">
          <img class="mascot-img" id="mascot-category-letters" data-pose="idle" src="assets/mascots/buchstabino_zahlofant_assets/svg/buchstabino_idle.svg" alt="Buchstabino" width="96" height="96">
          <span class="mode-card__title">Buchstaben</span>
          <span class="mode-card__desc">Buchstaben hören, finden &amp; üben</span>
        </button>
        <button class="mode-card category-card" type="button" data-category="numbers">
          <img class="mascot-img" id="mascot-category-numbers" data-pose="idle" src="assets/mascots/buchstabino_zahlofant_assets/svg/zahlofant_idle.svg" alt="Zahlofant" width="96" height="96">
          <span class="mode-card__title">Zahlen</span>
          <span class="mode-card__desc">Zählen, Addieren &amp; Subtrahieren</span>
        </button>
      </div>
    </section>

    <!-- Moduswahl-Screen (zweite Ebene, Kategorie "Zahlen") -->
    <section class="screen mode-select" id="screen-mode-select" hidden>
      <button class="btn-back btn-back-category" type="button" aria-label="Menü: zurück zur Kategoriewahl">🏠 Menü</button>
      <div class="mode-select__header">
        <img class="mascot-img mascot-img--lg" id="mascot-mode-select" data-pose="idle" src="assets/mascots/buchstabino_zahlofant_assets/svg/zahlofant_idle.svg" alt="Zahlofant" width="128" height="128">
        <h1 class="mode-select__title">Zahlen</h1>
      </div>
      <p class="mode-select__subtitle">Wähle ein Spiel:</p>

      <div class="mode-cards">
        <button class="mode-card" type="button" data-mode="count">
          <span class="mode-card__icon" aria-hidden="true">🔢</span>
          <span class="mode-card__title">Zählen</span>
          <span class="mode-card__desc">Zähle die Objekte</span>
        </button>
        <button class="mode-card" type="button" data-mode="arithmetic">
          <span class="mode-card__icon" aria-hidden="true">➕➖</span>
          <span class="mode-card__title">Addieren/Subtrahieren</span>
          <span class="mode-card__desc">Wie viele sind es?</span>
        </button>
      </div>
    </section>

    <!-- Moduswahl-Screen (zweite Ebene, Kategorie "Buchstaben") -->
    <section class="screen mode-select" id="screen-letters-mode-select" hidden>
      <button class="btn-back btn-back-category" type="button" aria-label="Menü: zurück zur Kategoriewahl">🏠 Menü</button>
      <div class="mode-select__header">
        <img class="mascot-img mascot-img--lg" id="mascot-letters-mode-select" data-pose="idle" src="assets/mascots/buchstabino_zahlofant_assets/svg/buchstabino_idle.svg" alt="Buchstabino" width="128" height="128">
        <h1 class="mode-select__title">Buchstaben</h1>
      </div>
      <p class="mode-select__subtitle">Wähle ein Spiel:</p>

      <div class="mode-cards">
        <button class="mode-card" type="button" data-mode="lettersHear">
          <span class="mode-card__icon" aria-hidden="true">👂</span>
          <span class="mode-card__title">Hören</span>
          <span class="mode-card__desc">Welcher Buchstabe wurde genannt?</span>
        </button>
        <button class="mode-card" type="button" data-mode="lettersFind">
          <span class="mode-card__icon" aria-hidden="true">🔍</span>
          <span class="mode-card__title">Finden</span>
          <span class="mode-card__desc">Tippe den gesuchten Buchstaben an</span>
        </button>
        <button class="mode-card" type="button" data-mode="lettersDraw">
          <span class="mode-card__icon" aria-hidden="true">✏️</span>
          <span class="mode-card__title">Zeichnen</span>
          <span class="mode-card__desc">Buchstaben nachfahren &amp; üben</span>
        </button>
      </div>
    </section>

    <!-- Spiel-Screen -->
    <section class="screen game-container" id="screen-game" hidden>
      <!-- Header mit Fortschritt -->
      <header class="game-header">
        <button class="btn-back" id="btn-menu" aria-label="Zurück zur Moduswahl">◀ Zurück</button>
        <div class="progress-ring" role="img" aria-label="Fortschritt">
          <svg class="progress-svg" viewBox="0 0 60 60">
            <circle class="progress-bg" cx="30" cy="30" r="26"></circle>
            <circle class="progress-bar" cx="30" cy="30" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"></circle>
          </svg>
          <div class="streak-display" aria-live="polite" aria-atomic="true">
            <span class="streak-icon">🔥</span>
            <span class="streak-count">0</span>
          </div>
          <span class="level-badge" aria-live="polite">Level 1</span>
        </div>
        <img class="mascot-img mascot-img--sm" id="mascot-game" data-pose="idle" src="assets/mascots/buchstabino_zahlofant_assets/svg/zahlofant_idle.svg" alt="Zahlofant" width="56" height="56">
      </header>

      <!-- Aufgaben-Bereich -->
      <section class="task-area" aria-live="polite" aria-atomic="true">
        <!-- Motiv-Bühne (Objekte zum Zählen/Vergleichen) -->
        <div class="motif-container" role="img" aria-label="Aufgabe">
          <div class="motif-stage" id="motif-stage"></div>
          <p class="task-question" id="task-question">Lade Aufgabe…</p>
        </div>

        <!-- Antwort-Optionen -->
        <div class="options-container" role="group" aria-label="Antwortmöglichkeiten">
          <button class="option-btn" data-value="" aria-pressed="false" tabindex="0"></button>
          <button class="option-btn" data-value="" aria-pressed="false" tabindex="0"></button>
          <button class="option-btn" data-value="" aria-pressed="false" tabindex="0"></button>
        </div>
      </section>

      <!-- Feedback-Bereich -->
      <div class="feedback-area" aria-live="assertive" aria-atomic="true" hidden>
        <div class="feedback-message" id="feedback-message"></div>
      </div>

      <!-- Steuerung -->
      <footer class="game-footer">
        <button class="btn-pause" id="btn-pause" aria-label="Pause">
          <span aria-hidden="true">⏸️</span> Pause
        </button>
        <button class="btn-repeat" id="btn-repeat" aria-label="Aufgabe wiederholen">
          <span aria-hidden="true">🔁</span> Wiederholen
        </button>
        <button class="btn-help" id="btn-help" aria-label="Hilfe: richtige Antwort zeigen">
          <span aria-hidden="true">💡</span> Hilfe
        </button>
      </footer>
    </section>

    <!-- Zeichnen-Screen (Buchstaben nachfahren) -->
    <section class="screen draw-container" id="screen-letter-draw" hidden>
      <header class="draw-header">
        <button class="btn-back" id="btn-draw-menu" type="button" aria-label="Zurück zur Moduswahl">◀ Zurück</button>
        <img class="mascot-img mascot-img--sm" id="mascot-draw" data-pose="idle" src="assets/mascots/buchstabino_zahlofant_assets/svg/buchstabino_idle.svg" alt="Buchstabino" width="56" height="56">
      </header>

      <p class="draw-question" id="draw-question" aria-live="polite">Fahre den Buchstaben nach</p>

      <div class="draw-stage">
        <canvas class="draw-guide-canvas" id="draw-guide-canvas" aria-hidden="true"></canvas>
        <canvas class="draw-ink-canvas" id="draw-ink-canvas" role="img" aria-label="Zeichenfläche"></canvas>
        <div class="draw-help-marker" id="draw-help-marker" aria-hidden="true" hidden></div>
      </div>

      <div class="draw-stars" id="draw-stars" aria-live="polite" hidden></div>

      <footer class="draw-footer">
        <button class="btn-secondary" id="btn-draw-clear" type="button">🧹 Löschen</button>
        <button class="btn-repeat" id="btn-draw-repeat" type="button" aria-label="Buchstabe wiederholen">
          <span aria-hidden="true">🔁</span> Hören
        </button>
        <button class="btn-help" id="btn-draw-help" type="button" aria-label="Hilfe: Buchstabe vorzeichnen">
          <span aria-hidden="true">💡</span> Hilfe
        </button>
        <button class="btn-primary" id="btn-draw-next" type="button">Weiter ▶</button>
      </footer>
    </section>

    <!-- Sticker-Album: dauerhafter Fortschritt (Pflanze) + Meilenstein-
         Sticker, vom Kategoriewahl-Screen aus erreichbar (🎁-Button). -->
    <section class="screen album-screen" id="screen-sticker-album" hidden>
      <button class="btn-back btn-back-category" type="button" aria-label="Menü: zurück zur Kategoriewahl">🏠 Menü</button>

      <div class="album-header">
        <h1 class="album-header__title">🎁 Sticker-Album</h1>
      </div>

      <div class="album-content">
        <div class="progress-plant" role="img" aria-label="Dein Fortschritt: eine wachsende Pflanze">
          <div class="progress-plant__pot" aria-hidden="true">🪴</div>
          <div class="progress-plant__stage" id="progress-plant-stage" aria-hidden="true">🌱</div>
        </div>

        <div class="sticker-grid" id="sticker-grid" role="list" aria-label="Deine Sticker"></div>
      </div>

      <footer class="album-footer">
        <button class="btn-parent-gate" id="btn-parent-gate" type="button">
          <span aria-hidden="true">👪</span> Für Eltern (2&nbsp;Sek. halten)
        </button>
      </footer>
    </section>
  </main>

  <!-- Eltern-Bereich: nur per 2-Sekunden-Halten erreichbar, rein
       informativ (kein Kinder-Feedback, keine Gamification). -->
  <dialog class="parent-modal" id="parent-modal" aria-labelledby="parent-title">
    <div class="modal-content">
      <h2 id="parent-title">👪 Für Eltern</h2>
      <div class="parent-stats" id="parent-stats"></div>
      <div class="modal-actions">
        <button class="btn-primary" id="btn-parent-close">Schließen</button>
      </div>
    </div>
  </dialog>

  <!-- Pause-Modal -->
  <dialog class="pause-modal" id="pause-modal" aria-labelledby="pause-title">
    <div class="modal-content">
      <h2 id="pause-title">⏸️ Pause</h2>
      <p class="pause-stats" id="pause-stats"></p>
      <div class="modal-actions">
        <button class="btn-primary" id="btn-resume">Weiterspielen</button>
        <button class="btn-secondary" id="btn-restart">Neu starten</button>
      </div>
    </div>
  </dialog>

  <!-- Install-Hinweis (PWA) -->
  <div class="install-banner" id="install-banner" hidden role="status" aria-live="polite">
    <p>📱 <strong>Als App installieren</strong> – für Offline-Spiel & Vollbild!</p>
    <div class="install-actions">
      <button class="btn-primary" id="btn-install">Installieren</button>
      <button class="btn-ghost" id="btn-dismiss">Später</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Install-Prompt handling
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').hidden = false;
    });
    document.getElementById('btn-install')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') deferredPrompt = null;
        document.getElementById('install-banner').hidden = true;
      }
    });
    document.getElementById('btn-dismiss')?.addEventListener('click', () => {
      document.getElementById('install-banner').hidden = true;
    });
  </script>
</body>
</html>
