<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Audio Generator</title>
</head>
<body>
  <h1>Erstellen von Audiodateien für Buchstabino & Zahlofant</h1>

  <div>
    <label for="number">Zahl auswählen (1-20):</label>
    <input type="number" id="number" min="1" max="20" value="1">
    <button id="generate">Generiere</button>
    <p id="status"></p>
  </div>

  <div id="output"></div>

  <script>
    const numberWords = [
      'eins', 'zwei', 'drei', 'vier', 'fünf',
      'sechs', 'sieben', 'acht', 'neun', 'zehn',
      'elf', 'zwölf', 'dreizehn', 'vierzehn', 'fünfzehn',
      'sechzehn', 'siebzehn', 'achtzehn', 'neunzehn', 'zwanzig'
    ];

    document.getElementById('generate').addEventListener('click', () => {
      const num = document.getElementById('number').value;
      const text = numberWords[num - 1];
      const status = document.getElementById('status');
      status.textContent = 'Spreche...';

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'de-DE';
      utterance.rate = 0.9;

      utterance.onstart = () => {
        status.textContent = 'Spreche ' + text;
      };

      utterance.onend = () => {
        status.textContent = 'fertig';
        const output = document.getElementById('output');
        output.innerHTML = '<p>Audio-Daten bereit. Zum Herunterladen:</p><ul><li><a href="#" id="download-link">Herunterladen</a></li></ul>';
        document.getElementById('download-link').addEventListener('click', (e) => {
          e.preventDefault();
          const blob = new Blob([audioBuffer], { type: 'audio/wav' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = text + '.wav';
          a.click();
        });
      };

      utterance.onerror = (err) => {
        status.textContent = 'Fehler: ' + err.error;
      };

      // Capture audio via MediaRecorder
      const audioBuffer = [];
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const destination = audioContext.createMediaStreamDestination();
      const mediaRecorder = new MediaRecorder(destination.stream);
      mediaRecorder.ondataavailable = (e) => audioBuffer.push(e.data);
      mediaRecorder.start();
      speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>
